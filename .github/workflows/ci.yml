name: CI
on:
  push:
  pull_request:
jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Test test_m1_6_feasibility
        run: python -m unittest discover -s tests -p 'test_m1_6_feasibility.py' -v
      - name: Test test_m2_10_messages
        run: python -m unittest discover -s tests -p 'test_m2_10_messages.py' -v
      - name: Test test_m2_11_files
        run: python -m unittest discover -s tests -p 'test_m2_11_files.py' -v
      - name: Test test_m2_12_fidonet
        run: python -m unittest discover -s tests -p 'test_m2_12_fidonet.py' -v
      - name: Test test_m2_13_terminal
        run: python -m unittest discover -s tests -p 'test_m2_13_terminal.py' -v
      - name: Test test_m2_14_terminal_compat
        run: python -m unittest discover -s tests -p 'test_m2_14_terminal_compat.py' -v
      - name: Test test_m2_15_terminal_ux
        run: python -m unittest discover -s tests -p 'test_m2_15_terminal_ux.py' -v
      - name: Test test_m2_16_platform_api
        run: python -m unittest discover -s tests -p 'test_m2_16_platform_api.py' -v
      - name: Test test_m2_1_scheduler
        run: python -m unittest discover -s tests -p 'test_m2_1_scheduler.py' -v
      - name: Test test_m2_2_kernel_abi
        run: python -m unittest discover -s tests -p 'test_m2_2_kernel_abi.py' -v
      - name: Test test_m2_3_bus
        run: python -m unittest discover -s tests -p 'test_m2_3_bus.py' -v
      - name: Test test_m2_4_serial
        run: python -m unittest discover -s tests -p 'test_m2_4_serial.py' -v
      - name: Test test_m2_5_network
        run: python -m unittest discover -s tests -p 'test_m2_5_network.py' -v
      - name: Test test_m2_6_storage
        run: python -m unittest discover -s tests -p 'test_m2_6_storage.py' -v
      - name: Test test_m2_7_bbs
        run: python -m unittest discover -s tests -p 'test_m2_7_bbs.py' -v
      - name: Test test_m2_8_auth
        run: python -m unittest discover -s tests -p 'test_m2_8_auth.py' -v
      - name: Test test_m2_9_kscript
        run: python -m unittest discover -s tests -p 'test_m2_9_kscript.py' -v
      - name: Test test_machine
        run: python -m unittest discover -s tests -p 'test_machine.py' -v
      - name: Test M2.18 portable C terminal core
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c tests/test_m2_18_terminal_core.c \
            -o /tmp/test_m2_18_terminal_core
          /tmp/test_m2_18_terminal_core
      - name: Test M2.19 portable terminal screen
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c tests/test_m2_19_terminal_screen.c \
            -o /tmp/test_m2_19_terminal_screen
          /tmp/test_m2_19_terminal_screen

      - name: Test M2.20 glyph decoding
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c tests/test_m2_20_glyph_decode.c \
            -o /tmp/test_m2_20_glyph_decode
          /tmp/test_m2_20_glyph_decode

      - name: Test M2.21 portable renderer contract
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c src/terminal/renderer.c \
            tests/test_m2_21_renderer.c -o /tmp/test_m2_21_renderer
          /tmp/test_m2_21_renderer

      - name: Test M2.22 terminal event and input abstraction
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c src/terminal/event.c src/terminal/key_encode.c \
            tests/test_m2_22_event.c -o /tmp/test_m2_22_event
          /tmp/test_m2_22_event
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/key_encode.c tests/test_m2_22_key_encode.c \
            -o /tmp/test_m2_22_key_encode
          /tmp/test_m2_22_key_encode

      - name: Test M2.23 portable frontend adapter
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c src/terminal/renderer.c \
            src/terminal/event.c src/terminal/key_encode.c src/terminal/frontend.c \
            tests/test_m2_23_frontend.c -o /tmp/test_m2_23_frontend
          /tmp/test_m2_23_frontend

      - name: Test M2.23 cross-platform adapter boundary
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/terminal.c src/terminal/screen.c src/terminal/renderer.c \
            src/terminal/event.c src/terminal/key_encode.c src/terminal/frontend.c \
            src/terminal/platform.c tests/test_m2_23_platform.c \
            -o /tmp/test_m2_23_platform
          /tmp/test_m2_23_platform

      - name: Test M2.24 terminal font provider
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/font.c tests/test_m2_24_font.c \
            -o /tmp/test_m2_24_font
          /tmp/test_m2_24_font

      - name: Test M2.24 bitmap renderer integration
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/screen.c src/terminal/font.c src/terminal/renderer.c \
            tests/test_m2_24_bitmap_renderer.c \
            -o /tmp/test_m2_24_bitmap_renderer
          /tmp/test_m2_24_bitmap_renderer

      - name: Test M2.24 bitmap renderer
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/screen.c src/terminal/renderer.c src/terminal/font.c \
            tests/test_m2_24_bitmap_renderer.c \
            -o /tmp/test_m2_24_bitmap_renderer
          /tmp/test_m2_24_bitmap_renderer

      - name: Test M2.24 bitmap renderer path
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/screen.c src/terminal/font.c src/terminal/renderer.c \
            tests/test_m2_24_bitmap_renderer.c \
            -o /tmp/test_m2_24_bitmap_renderer
          /tmp/test_m2_24_bitmap_renderer

      - name: Test M2.25 reference bitmap rasterizer
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/raster.c tests/test_m2_25_raster.c \
            -o /tmp/test_m2_25_raster
          /tmp/test_m2_25_raster

      - name: Test M2.26 terminal palette
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/palette.c tests/test_m2_26_palette.c \
            -o /tmp/test_m2_26_palette
          /tmp/test_m2_26_palette

      - name: Test M2.27 terminal display presentation
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/display.c tests/test_m2_27_display.c \
            -o /tmp/test_m2_27_display
          /tmp/test_m2_27_display

      - name: Test M2.28 dirty display rows
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/dirty.c tests/test_m2_28_dirty.c \
            -o /tmp/test_m2_28_dirty
          /tmp/test_m2_28_dirty

      - name: Test M2.28 damage to display E2E
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/screen.c src/terminal/terminal.c src/terminal/renderer.c \
            src/terminal/font.c src/terminal/dirty.c src/terminal/display.c \
            tests/test_m2_28_damage_e2e.c \
            -o /tmp/test_m2_28_damage_e2e
          /tmp/test_m2_28_damage_e2e

      - name: Test M2.29 presentation scheduler
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/scheduler.c tests/test_m2_29_scheduler.c \
            -o /tmp/test_m2_29_scheduler
          /tmp/test_m2_29_scheduler

      - name: Test M2.29 scheduler display retry
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/display.c src/terminal/scheduler.c \
            tests/test_m2_29_scheduler_display.c \
            -o /tmp/test_m2_29_scheduler_display
          /tmp/test_m2_29_scheduler_display

      - name: Test M2.29 blink scheduling
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/screen.c src/terminal/dirty.c src/terminal/blink.c \
            src/terminal/display.c src/terminal/scheduler.c \
            tests/test_m2_29_blink.c -o /tmp/test_m2_29_blink
          /tmp/test_m2_29_blink

      - name: Test M2.30 terminal viewport
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/viewport.c src/terminal/event.c src/terminal/key_encode.c tests/test_m2_30_viewport.c \
            -o /tmp/test_m2_30_viewport
          /tmp/test_m2_30_viewport

      - name: Test M2.31 terminal geometry policy
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/viewport.c src/terminal/event.c src/terminal/key_encode.c \
            src/terminal/geometry.c tests/test_m2_31_geometry.c \
            -o /tmp/test_m2_31_geometry
          /tmp/test_m2_31_geometry

      - name: Test M2.32 terminal session resize
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry.c src/terminal/viewport.c src/terminal/session.c \
            tests/test_m2_32_session.c -o /tmp/test_m2_32_session
          /tmp/test_m2_32_session

      - name: Test M2.32 renderer resize integration
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry.c src/terminal/session.c src/terminal/renderer.c \
            src/terminal/screen.c tests/test_m2_32_render_resize.c \
            -o /tmp/test_m2_32_render_resize
          /tmp/test_m2_32_render_resize

      - name: Test M2.32 presentation resize integration
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry.c src/terminal/session.c src/terminal/renderer.c \
            src/terminal/screen.c src/terminal/dirty.c src/terminal/scheduler.c \
            src/terminal/display.c tests/test_m2_32_present_resize.c \
            -o /tmp/test_m2_32_present_resize
          /tmp/test_m2_32_present_resize

      - name: Test M2.33 transactional resize orchestration
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry.c src/terminal/viewport.c src/terminal/session.c \
            src/terminal/dirty.c src/terminal/scheduler.c src/terminal/resize.c \
            tests/test_m2_33_resize.c -o /tmp/test_m2_33_resize
          /tmp/test_m2_33_resize

      - name: Test M2.34 normalized geometry events
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_event.c src/terminal/geometry.c src/terminal/session.c \
            src/terminal/resize.c src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_34_geometry_event.c -o /tmp/test_m2_34_geometry_event
          /tmp/test_m2_34_geometry_event

      - name: Test M2.34 geometry event resize E2E
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_event.c src/terminal/geometry.c src/terminal/session.c \
            src/terminal/resize.c src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_34_resize_e2e.c -o /tmp/test_m2_34_resize_e2e
          /tmp/test_m2_34_resize_e2e

      - name: Test M2.35 geometry transport adapters
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_adapter.c src/terminal/geometry_event.c \
            src/terminal/geometry.c src/terminal/session.c src/terminal/resize.c \
            src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_35_telnet_naws.c -o /tmp/test_m2_35_telnet_naws
          /tmp/test_m2_35_telnet_naws
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_adapter.c src/terminal/geometry_event.c \
            src/terminal/geometry.c src/terminal/session.c src/terminal/resize.c \
            src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_35_ssh_pty.c -o /tmp/test_m2_35_ssh_pty
          /tmp/test_m2_35_ssh_pty
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_adapter.c src/terminal/geometry_event.c \
            src/terminal/geometry.c src/terminal/viewport.c src/terminal/session.c \
            src/terminal/resize.c src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_35_viewport.c -o /tmp/test_m2_35_viewport
          /tmp/test_m2_35_viewport

      - name: Test M2.35 geometry adapter E2E
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
            src/terminal/geometry_adapter.c src/terminal/geometry_event.c \
            src/terminal/geometry.c src/terminal/viewport.c src/terminal/session.c \
            src/terminal/resize.c src/terminal/dirty.c src/terminal/scheduler.c \
            tests/test_m2_35_adapter_e2e.c -o /tmp/test_m2_35_adapter_e2e
          /tmp/test_m2_35_adapter_e2e

      - name: Test M2.36 geometry session binding
        run: |
          for test in tests/test_m2_36_geometry_session.c tests/test_m2_36_geometry_ownership.c; do
            out="/tmp/$(basename "$test" .c)"
            cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
              src/terminal/geometry_session.c src/terminal/geometry_adapter.c \
              src/terminal/geometry_event.c src/terminal/geometry.c \
              src/terminal/viewport.c src/terminal/session.c src/terminal/resize.c \
              src/terminal/dirty.c src/terminal/scheduler.c "$test" -o "$out"
            "$out"
          done

      - name: Test M2.37 geometry lifecycle
        run: |
          for test in tests/test_m2_37_geometry_lifecycle.c tests/test_m2_37_geometry_takeover.c; do
            out="/tmp/$(basename "$test" .c)"
            cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
              src/terminal/geometry_session.c src/terminal/geometry_adapter.c \
              src/terminal/geometry_event.c src/terminal/geometry.c \
              src/terminal/viewport.c src/terminal/session.c src/terminal/resize.c \
              src/terminal/dirty.c src/terminal/scheduler.c "$test" -o "$out"
            "$out"
          done

      - name: Test M2.38 local geometry lifecycle
        run: |
          for test in tests/test_m2_38_viewport_lifecycle.c tests/test_m2_38_cross_policy.c; do
            out="/tmp/$(basename "$test" .c)"
            cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude \
              src/terminal/geometry_session.c src/terminal/geometry_adapter.c \
              src/terminal/geometry_event.c src/terminal/geometry.c \
              src/terminal/viewport.c src/terminal/session.c src/terminal/resize.c \
              src/terminal/dirty.c src/terminal/scheduler.c "$test" -o "$out"
            "$out"
          done
